# Review summaries need a Gemini key in Secret Manager.
# A rollout fails if this block names a secret that does not exist yet.
# After creating the key, uncomment the env block and roll out again:
#   firebase apphosting:secrets:set gemini-api-key
#   firebase apphosting:secrets:grantaccess gemini-api-key --backend css551307
# env:
#   - variable: GEMINI_API_KEY
#     secret: gemini-api-key
runConfig:
  minInstances: 0
  maxInstances: 2
